<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>gastrofest гомель — куда пойдём</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--card:#161616;--line:#2a2a2a;--tx:#f4f4f4;--mut:#9a9a9a;--y:#ffd400;--ytx:#0b0b0b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Montserrat',Arial,Helvetica,sans-serif;line-height:1.5;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:26px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;font-size:15px}
.top b{color:var(--y)}
.top span{color:var(--mut);font-weight:500;font-size:12px}
h1{font-size:clamp(34px,9vw,60px);line-height:1.02;font-weight:900;text-transform:uppercase;margin:0 0 14px}
h1 em{font-style:normal;color:var(--y)}
h2{font-size:clamp(22px,5.5vw,30px);font-weight:900;text-transform:uppercase;margin:0 0 20px;line-height:1.15}
p{color:var(--mut);margin:0 0 22px}
.tag{display:inline-block;background:var(--y);color:var(--ytx);font-weight:900;text-transform:uppercase;font-size:13px;padding:5px 12px;border-radius:3px;margin-bottom:18px}
.btn{display:inline-block;background:var(--y);color:var(--ytx);border:0;font:inherit;font-weight:900;text-transform:uppercase;letter-spacing:.04em;padding:15px 30px;border-radius:4px;cursor:pointer;text-decoration:none;font-size:15px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--y);border:2px solid var(--y)}
.bar{height:4px;background:var(--line);border-radius:2px;margin-bottom:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--y);transition:width .35s}
.cnt{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:22px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:11px;font:inherit;font-weight:500;font-size:16px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover,.opt:focus-visible{border-color:var(--y);outline:0}
.opt:active{background:#222}
.scr{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.win{background:var(--card);border:2px solid var(--y);border-radius:8px;padding:24px 20px;margin-bottom:22px}
.win h3{font-size:clamp(28px,8vw,44px);font-weight:900;text-transform:uppercase;margin:0 0 6px;line-height:1.05;color:var(--y)}
.pct{font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-bottom:14px}
.win p{color:var(--tx);margin:0 0 16px}
.info{border-top:1px solid var(--line);padding-top:14px;font-size:14px;color:var(--mut)}
.info div{margin-bottom:5px}.info b{color:var(--tx);font-weight:700}
.info a{color:var(--y)}
.sub{font-weight:900;text-transform:uppercase;font-size:13px;letter-spacing:.08em;margin:26px 0 12px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:13px 16px;margin-bottom:9px;font-size:15px}
.row small{color:var(--mut);display:block;font-size:12px}
.row .p{font-weight:900;color:var(--y);white-space:nowrap}
.foot{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);color:var(--mut);font-size:12px;text-align:center}
.foot a{color:var(--y)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
</style>
</head>
<body>
<script>
var V={
rab:{n:'ресторан рабиналли',a:'ул. Ильича, 51',t:'+375 29 655 30 20',h:'пн–вс 11:30–22:00',d:'спокойный ресторан для неспешного ужина вдвоём'},
pel:{n:'кафе «пельместо»',a:'ул. Советская, 44',t:'+375 29 550 55 45',h:'пн–вс 09:30–22:30',d:'пельмени и домашняя кухня, просто и вкусно'},
hin:{n:'ресторан «хинкальня»',a:'ул. Советская, 44',t:'+375 29 308 13 13',h:'пн–вс 12:00–23:00',d:'грузинская кухня: хинкали, сытно и по-тёплому'},
umi:{n:'umi',a:'ул. Кирова, 35',t:'+375 29 308 55 56',h:'пн 12:00–21:45 · вт–сб 12:00–22:45 · вс 11:00–21:45',d:'азиатская кухня для тех, кто хочет чего-то нового'},
gar:{n:'garage food&coffee',a:'пр-т Речицкий, 5в',t:'+375 29 193 06 00',h:'пн–вс 10:00–23:00',d:'еда и кофе без пафоса, свободная атмосфера'},
gra:{n:'гранд кафе',a:'ул. Советская, 16',t:'+375 44 567 56 75',h:'пн–пт 15:00–22:40 · сб–вс 11:00–22:40',d:'классическое кафе в центре, привычно и уютно'},
mat:{n:'«матрёшка» караоке-бар',a:'ул. Советская, 20',t:'+375 44 580 08 80',h:'пн–вс 18:00–00:00',d:'народный бар с караоке, где вечер точно будет шумным и весёлым'},
ras:{n:'ресторан rasskazov',a:'ул. Кирова, 90а',t:'+375 29 111 16 86',h:'пн–вс 12:00–22:30',d:'ресторан для особенного ужина, когда хочется красиво'},
kvar:{n:'бар «квартирник»',a:'ул. Билецкий спуск, 1',t:'+375 44 766 02 99',h:'пн–пт 17:00–23:30 · сб–вс 14:00–23:30',d:'бар с духом квартирника: пиво, разговоры и музыка'}
};
var Q=[
{q:'какое у тебя настроение на этот вечер?',o:[
['тихо и уютно',{rab:2,gra:2,ras:1,pel:1}],
['шумно и весело',{mat:3,kvar:2,gar:1}],
['просто и по-домашнему',{pel:3,hin:1,gar:1}],
['хочется чего-то особенного',{ras:2,umi:2,rab:1}]]},
{q:'что хочется съесть?',o:[
['что-нибудь грузинское',{hin:3}],
['азиатское',{umi:3}],
['пельмени и домашнее',{pel:3,gra:1}],
['мясо, бургеры, гриль',{gar:2,ras:1,kvar:1,rab:1}]]},
{q:'во сколько пойдём?',o:[
['днём',{pel:2,gar:2,gra:1,rab:1,hin:1}],
['ранним вечером',{rab:1,hin:1,umi:1,ras:1,gra:1}],
['поздно вечером',{mat:3,kvar:3,hin:1}]]},
{q:'что с музыкой?',o:[
['чтобы можно было поговорить в тишине',{rab:2,gra:2,ras:2}],
['фоном, ненавязчиво',{umi:1,gar:2,hin:2,pel:1}],
['живая музыка или караоке',{mat:3,kvar:2}]]},
{q:'что будем пить?',o:[
['пиво',{kvar:2,hin:1,gar:1,mat:1}],
['коктейль',{umi:2,rab:1,kvar:1,ras:1}],
['кофе или чай',{gar:2,pel:1,gra:1}],
['вино',{rab:2,ras:2,hin:1}]]},
{q:'насколько мы голодные?',o:[
['легко перекусить',{umi:1,gar:1,pel:1,gra:1}],
['нормально поужинать',{rab:1,gra:1,umi:1,kvar:1}],
['очень голодные',{hin:2,ras:2,pel:1,gar:1}]]},
{q:'как насчёт эксперимента?',o:[
['люблю проверенное',{gra:2,pel:2,rab:1}],
['давай попробуем новое',{umi:2,hin:1,mat:1,kvar:1}],
['удиви меня',{mat:2,ras:1,umi:1,kvar:1}]]},
{q:'хочется погулять по советской?',o:[
['да, центр рядом',{pel:1,hin:1,gra:1,mat:1}],
['неважно, главное место',{}]]}
];
var i=0,S,app=document.getElementById('app');
function start(){
 i=0;S={};for(var k in V)S[k]=0;
 app.innerHTML='<div class="scr"><div class="tag">39 руб за сет</div><h1>куда мы <em>пойдём</em>?</h1><p>в гомеле идёт gastrofest.craft, и в нём девять заведений. ответь на восемь вопросов, а я выберу, куда идти нам сегодня</p><button class="btn" onclick="ask()">поехали</button></div>';
}
function ask(){
 var x=Q[i];
 var h='<div class="scr"><div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div><div class="cnt">вопрос '+(i+1)+' из '+Q.length+'</div><h2>'+x.q+'</h2>';
 x.o.forEach(function(o,j){h+='<button class="opt" onclick="pick('+j+')">'+o[0]+'</button>'});
 app.innerHTML=h+'</div>';
}
function pick(j){
 var w=Q[i].o[j][1];
 for(var k in w)S[k]+=w[k];
 i++;
 if(i<Q.length)ask();else done();
}
function done(){
 var r=Object.keys(V).sort(function(a,b){return S[b]-S[a]});
 var max=S[r[0]]||1,w=V[r[0]];
 var h='<div class="scr"><div class="tag">вам сюда</div><div class="win"><div class="pct">совпадение '+Math.round(S[r[0]]/max*100)+'%</div><h3>'+w.n+'</h3><p>'+w.d+'</p><div class="info"><div><b>адрес:</b> '+w.a+', гомель</div><div><b>часы:</b> '+w.h+'</div><div><b>телефон:</b> <a href="tel:'+w.t.replace(/ /g,'')+'">'+w.t+'</a></div></div></div>';
 h+='<div class="sub">запасные варианты</div>';
 r.slice(1,4).forEach(function(k){
  h+='<div class="row"><div>'+V[k].n+'<small>'+V[k].a+'</small></div><div class="p">'+Math.round(S[k]/max*100)+'%</div></div>';
 });
 h+='<div class="acts"><button class="btn" onclick="start()">пройти заново</button><a class="btn ghost" href="https://gastrofest.by/gomel" target="_blank" rel="noopener">все сеты</a></div></div>';
 app.innerHTML=h;
}
start();
</script>
</body>
</html>
